apiVersion: karpenter.sh/v1alpha5
kind: Provisioner
metadata:
  name: arm64-provisioner
spec:
  requirements:
    - key: "karpenter.sh/capacity-type"
      operator: In
      values: ["spot"]
    - key: "kubernetes.io/arch"
      operator: In
      values: ["arm64"]
    - key: "node.kubernetes.io/instance-type"
      operator: In
      values: ["m6g.small"]
    - key: "kubernetes.io/os"
      operator: In
      values: ["linux"]

  limits:
    resources:
      cpu: "4000"
      memory: "16Gi"

  ttlSecondsAfterEmpty: 60

  labels:
    environment: "arch"
    team: "arm64"

  taints:
    - key: "arch"
      value: "arm64"
      effect: "NoSchedule"

  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 1m