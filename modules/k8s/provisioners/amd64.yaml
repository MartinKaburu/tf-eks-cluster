apiVersion: karpenter.sh/v1alpha5
kind: Provisioner
metadata:
  name: amd64-provisioner
spec:
  requirements:
    - key: "karpenter.sh/capacity-type"
      operator: In
      values: ["spot"]
    - key: "kubernetes.io/arch"
      operator: In
      values: ["amd64"]
    - key: "node.kubernetes.io/instance-type"
      operator: In
      values: ["t3.small"]
    - key: "kubernetes.io/os"
      operator: In
      values: ["linux"]

  limits:
    resources:
      cpu: "4000"
      memory: "16Gi"

  ttlSecondsAfterEmpty: 60

  labels:
    environment: "arch"
    team: "amd64"

  taints:
    - key: "arch"
      value: "amd64"
      effect: "NoSchedule"

  consolidation:
    enabled: true # Enable consolidation to reduce costs