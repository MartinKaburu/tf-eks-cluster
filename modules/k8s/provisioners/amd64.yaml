apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: amd64-nodepool
spec:
  template:
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: amd64-nodeclass

      requirements:
        - key: "karpenter.sh/capacity-type"
          operator: In
          values: ["spot"]
        - key: "kubernetes.io/arch"
          operator: In
          values: ["amd64"]
        - key: "node.kubernetes.io/instance-type"
          operator: In
          values: ["t3.small"]
        - key: "kubernetes.io/os"
          operator: In
          values: ["linux"]

      terminationGracePeriod: 1h

      taints:
        - key: "arch"
          value: "amd64"
          effect: "NoSchedule"

  disruption:
    consolidationPolicy: "WhenEmptyOrUnderutilized"
    consolidateAfter: "30s"

  limits:
    cpu: "4000"
    memory: "16Gi"
