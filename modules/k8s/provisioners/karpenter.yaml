---
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: multi-arch-nodeclass
spec:
  amiFamily: AL2
  instanceProfile: eks-58ca8db0-a730-9cb2-01e2-a71e991ead8c
  amiSelectorTerms:
    - id: "ami-09c01b6eb63a9a94c" # amd64
    - id: "ami-0d7c315b12e4af4ac" # arm64
  subnetSelectorTerms:
    - id: "subnet-e708b6ab"
    - id: "subnet-f3e5fe8b"
  securityGroupSelectorTerms:
    - id: "sg-0a5e648b39e3f0bfd"

---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: multi-arch-nodepool
spec:
  template:
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: multi-arch-nodeclass

      requirements:
        - key: "karpenter.sh/capacity-type"
          operator: In
          values: ["spot"]
        - key: "kubernetes.io/arch"
          operator: In
          values: ["amd64", "arm64"]
        - key: "node.kubernetes.io/instance-type"
          operator: In
          values: ["t3.small", "t4g.small"]

      terminationGracePeriod: 1h

  disruption:
    consolidationPolicy: "WhenEmptyOrUnderutilized"
    consolidateAfter: "30s"

  limits:
    cpu: "4000"
    memory: "16Gi"
